<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0a0a0a;color:#00ff88;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column;text-align:center}
h1{font-size:32px;margin:0;letter-spacing:2px}
p{opacity:0.7;margin:10px}
button{padding:14px 28px;background:#00ff88;color:#000;border:none;border-radius:12px;margin-top:20px;font-weight:bold;font-size:16px}
small{margin-top:30px;opacity:0.5}
</style></head>
<body>
<h1>RIBASA OS</h1>
<p id="status">Offline Mode</p>
<button onclick="tryOnline()">Coba Buka Online</button>
<button style="background:#333;color:#0f0" onclick="location.reload()">Reload</button>
<small>Ribasa OS v1.0 - Native APK</small>
<script>
function tryOnline(){
  document.getElementById('status').innerText='Checking...';
  fetch('https://anggara333.github.io/ribasa-os/', {mode:'no-cors', cache:'no-store'})
  .then(()=>{ location.href='https://anggara333.github.io/ribasa-os/'; })
  .catch(()=>{ document.getElementById('status').innerText='Masih offline / Pages belum aktif'; });
}
</script>
</body></html>
